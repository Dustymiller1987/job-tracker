<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
    <main class="container">
        <header class="auth-header">
            <h1>Welcome back</h1>
            <p class="auth-subtitle">Log in to keep your applications and follow-ups organised.</p>
        </header>

        <form id="loginForm" class="auth-form">
            <div class="field-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" name="email" placeholder="Email" autocomplete="email" required>
            </div>

            <div class="field-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" name="password" placeholder="Password" autocomplete="current-password" required>
            </div>

            <button type="submit">Login</button>
            <p id="loginMessage" role="status" aria-live="polite"></p>
        </form>

        <div class="auth-links">
            <span>Need an account?</span>
            <a href="register.html">Create one</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
