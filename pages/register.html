<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
    <main class="container">
        <header class="auth-header">
            <h1>Create your account</h1>
            <p class="auth-subtitle">Start tracking your applications, interviews, and follow-ups in one place.</p>
        </header>

        <form id="registerForm" class="auth-form">
            <div class="field-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Full Name" required>
            </div>

            <div class="field-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" minlength="6" required>
            </div>

            <button type="submit">Register</button>
            <p id="registerMessage" role="status" aria-live="polite"></p>
        </form>

        <div class="auth-links">
            <span>Already have an account?</span>
            <a href="login.html">Log in</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
