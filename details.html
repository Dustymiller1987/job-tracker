<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Details</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <p><a class="button-link" href="dashboard.html">Dashboard</a></p>
        <section id="applicationDetails" class="application-details-card" aria-live="polite"></section>
        <form id="statusForm" hidden>
            <label for="applicationStatus">Update status</label>
            <select id="applicationStatus" required>
                <option value="Interested">Interested</option>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Final Interview">Final Interview</option>
                <option value="Offer">Offer</option>
                <option value="Rejected">Rejected</option>
            </select>
            <button type="submit">Update Status</button>
            <p id="applicationUpdateMessage" class="form-message form-message-error" role="status" aria-live="polite"></p>
        </form>

        <section id="interviewHistorySection" hidden>
            <h2>Application notes</h2>
            <div id="interviewHistory" aria-live="polite"></div>
            <form id="interviewHistoryForm">
                <label for="interviewNotes">Add a note</label>
                <textarea id="interviewNotes" placeholder="Add details about this application" required></textarea>
                <button type="submit">Add Note</button>
                <p id="interviewNotesMessage" class="form-message form-message-error" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/details.js"></script>
</body>
</html>
